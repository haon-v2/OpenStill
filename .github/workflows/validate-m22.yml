name: Validate M22 (temporary)
on:
  push:
    branches: [claude/gifted-lovelace-pbg8wv-m22]
jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Build tools
        run: brew install meson ninja pkg-config cmake || true
      - name: Native dependencies
        run: bash scripts/build-native.sh > native.log 2>&1 || { tail -80 native.log; exit 1; }
      - name: New tests
        run: |
          set +e
          bash scripts/test.sh --filter "LibraryLocationsTests|AIBaseTests|LibraryCatalogTests" > new.log 2>&1; code=$?
          grep -E "error:|recorded an issue|Expectation failed" new.log | head -60
          tail -30 new.log; exit $code
      - name: Full suite
        run: |
          set +e
          bash scripts/test.sh > full.log 2>&1; code=$?
          grep -E "recorded an issue|Expectation failed" full.log | head -60
          tail -15 full.log; exit $code
      - name: App bundle
        run: bash scripts/build-app.sh > app.log 2>&1 || { grep -E "error:" app.log | head -40; tail -40 app.log; exit 1; }
      - name: Card ejected and plugged back in (real app)
        run: |
          set +e
          export OPENSTILL_STORAGE_ROOT=/tmp/os-catalog; mkdir -p $OPENSTILL_STORAGE_ROOT
          hdiutil create -size 64m -fs APFS -volname TESTCARD /tmp/card.dmg >/dev/null
          hdiutil attach /tmp/card.dmg > attach1.txt; cat attach1.txt
          mkdir -p /Volumes/TESTCARD/DCIM/100TEST
          n=0; for f in /System/Library/Desktop\ Pictures/*.heic; do n=$((n+1)); sips -s format jpeg -Z 1600 "$f" --out /Volumes/TESTCARD/DCIM/100TEST/IMG_000$n.jpg >/dev/null 2>&1; [ $n -ge 2 ] && break; done
          ls -la /Volumes/TESTCARD/DCIM/100TEST
          app=dist/OpenStill.app/Contents/MacOS/OpenStill
          env OPENSTILL_CACHE_SELFTEST=view:/tmp/cache $app /Volumes/TESTCARD/DCIM/100TEST > view.log 2>&1 &
          pid=$!; for s in $(seq 1 120); do sleep 1; kill -0 $pid 2>/dev/null || break; done; kill $pid 2>/dev/null
          grep "^CACHE" view.log || tail -40 view.log
          hdiutil detach /Volumes/TESTCARD; ls /Volumes
          env OPENSTILL_CACHE_SELFTEST=away:/tmp/cache $app > away.log 2>&1 &
          pid=$!
          for s in $(seq 1 120); do sleep 1; grep -q READY_FOR_MOUNT away.log && break; kill -0 $pid 2>/dev/null || break; done
          # The card comes back under another name.
          sudo mkdir -p "/Volumes/TESTCARD 1"
          sudo hdiutil attach /tmp/card.dmg -mountpoint "/Volumes/TESTCARD 1"; ls "/Volumes/TESTCARD 1/DCIM/100TEST"
          for s in $(seq 1 150); do sleep 1; kill -0 $pid 2>/dev/null || break; done; kill $pid 2>/dev/null
          grep "^CACHE" away.log || tail -60 away.log
          for f in /tmp/cache-*.png; do
            [ -f "$f" ] || continue
            sips -Z 900 -s format jpeg -s formatOptions 60 "$f" --out "$f.jpg" >/dev/null
            echo "BEGIN $f"; base64 -i "$f.jpg" | tr -d '\n'; echo; echo "END $f"
          done
          grep -q "^CACHE RELINKED" away.log
