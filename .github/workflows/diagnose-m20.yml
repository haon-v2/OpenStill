name: Diagnose M20
on:
  push:
    branches: [claude/gifted-lovelace-pbg8wv-m20]
jobs:
  diagnose:
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Build tools
        run: brew install meson ninja pkg-config cmake || true
      - name: Native dependencies
        run: bash scripts/build-native.sh > native.log 2>&1 || { tail -80 native.log; exit 1; }
      - name: App bundle
        run: bash scripts/build-app.sh > app.log 2>&1 || { grep -E "error:" app.log | head -40; tail -40 app.log; exit 1; }
      - name: Sample photos
        run: |
          mkdir -p /tmp/photos
          i=0; for f in /System/Library/Desktop\ Pictures/*.heic /Library/Desktop\ Pictures/*.heic; do [ -f "$f" ] || continue; i=$((i+1)); sips -s format jpeg -Z 1600 "$f" --out /tmp/photos/photo$i.jpg >/dev/null 2>&1; [ $i -ge 5 ] && break; done
          ls -la /tmp/photos
      - name: Run and screenshot
        run: |
          set +e
          while IFS='|' read name photos actions; do
            [ -n "$name" ] || continue
            defaults delete org.openstill.viewer OpenStillStudioLayout >/dev/null 2>&1
            args=""; [ "$photos" = "1" ] && args=/tmp/photos
            echo "=== $name ($actions)"
            env OPENSTILL_DUMP_ACTIONS="$actions" OPENSTILL_LAYOUT_DUMP=/tmp/dump-$name dist/OpenStill.app/Contents/MacOS/OpenStill $args &
            pid=$!
            for s in $(seq 1 60); do sleep 1; kill -0 $pid 2>/dev/null || break; done
            kill $pid 2>/dev/null; wait $pid
            for f in /tmp/dump-$name-capture.png /tmp/dump-$name-other*-capture.png; do
              [ -f $f ] || continue
              sips -Z 1300 -s format jpeg -s formatOptions 62 $f --out $f.jpg >/dev/null
              echo "BEGIN $f"; base64 -i $f.jpg | tr -d '\n'; echo; echo "END $f"
            done
          done <<'LIST'
          settings0|1|develop;settings:0
          settings1|1|develop;settings:1
          settings2|1|develop;settings:2
          settings3|1|develop;settings:3
          settings4|1|develop;settings:4
          library|1|library
          loupe|1|library;view:loupe
          compare|1|library;selectall;view:compare
          survey|1|library;selectall;view:survey
          people|1|library;people
          timeline|1|library;timeline
          metadata|1|library;selectall;action:editMetadata
          rename|1|library;selectall;action:renamePhotos
          export|1|library;selectall;action:exportPhoto
          logo|1|library;selectall;action:exportPhoto;action:createLogo
          import|1|develop;action:importPhotos
          map|1|develop;action:showMapModule
          book|1|develop;action:showBookModule
          slideshow|1|develop;action:showSlideshowModule
          print|1|develop;action:showPrintModule
          web|1|develop;action:showWebModule
          identity|1|develop;action:editIdentityPlate
          reference|1|develop;action:showReferenceView
          tether|1|develop;action:tetheredCapture
          presets|1|develop;panel:presets
          history|1|develop;panel:history
          info|1|develop;panel:info
          navigator|1|develop;panel:navigator
          crop|1|develop;tool:crop
          masking|1|develop;tool:masking
          narrow|1|size:900;develop
          empty|0|
          LIST
          true
