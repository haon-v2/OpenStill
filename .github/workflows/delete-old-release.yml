# One-time: deletes the "OpenStill v.0.1" release (tag "OpenStill"), whose zip contained a private project folder.
name: Delete v.0.1 release

on:
  push:
    branches: [claude/gifted-lovelace-pbg8wv]

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete OpenStill --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || echo "Release already deleted"
          echo "Remaining releases:"; gh release list --repo "$GITHUB_REPOSITORY"
          echo "Remaining tags:"; gh api "repos/$GITHUB_REPOSITORY/tags" --jq '.[].name'
