name: Diagnose layout
on:
  push:
    branches: [claude/gifted-lovelace-pbg8wv-m17]
jobs:
  diagnose:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build tools
        run: brew install meson ninja pkg-config cmake || true
      - name: Native dependencies
        run: bash scripts/build-native.sh > native.log 2>&1 || { tail -80 native.log; exit 1; }
      - name: App bundle
        run: bash scripts/build-app.sh > app.log 2>&1 || { tail -60 app.log; exit 1; }
      - name: Sample photos
        run: |
          mkdir -p /tmp/photos
          i=0; for f in /System/Library/Desktop\ Pictures/*.heic /Library/Desktop\ Pictures/*.heic; do [ -f "$f" ] || continue; i=$((i+1)); sips -s format jpeg -Z 1600 "$f" --out /tmp/photos/photo$i.jpg >/dev/null 2>&1; [ $i -ge 5 ] && break; done
          if [ $i -eq 0 ]; then for n in 1 2 3; do python3 -c "
          import zlib,struct
          w,h=800,600
          raw=b''.join(b'\x00'+bytes([(x*255//w),(y*255//h),120]*1 for x in range(w)) if False else b'' for y in range(h))
          " ; done; fi
          ls -la /tmp/photos
      - name: Run and screenshot
        run: |
          set +e
          for variant in "basic|develop|Basic||" "geometry|develop|Geometry||" "effects|develop|Effects||" "detail|develop|Detail||" "folders|library|||folders" "importcopy|develop|||import:copy" "importadd|develop|||import:add"; do
            IFS='|' read name module open filterbar actions <<< "$variant"
            defaults write org.openstill.viewer OpenStillWorkspaceLayout luminar
            fb=""; [ -n "$filterbar" ] && fb=1
            env ${fb:+OPENSTILL_DUMP_FILTERBAR=1} OPENSTILL_DUMP_ACTIONS="$actions" OPENSTILL_DUMP_MODULE="$module" OPENSTILL_DUMP_OPEN="$open" OPENSTILL_LAYOUT_DUMP=/tmp/dump-$name dist/OpenStill.app/Contents/MacOS/OpenStill /tmp/photos &
            pid=$!
            sleep 17
            wait $pid
            for f in /tmp/dump-$name.png /tmp/dump-$name-capture.png; do
              [ -f $f ] || { echo "missing $f"; continue; }
              sips -Z 1100 -s format jpeg -s formatOptions 60 $f --out $f.jpg >/dev/null
              echo "BEGIN $f"; base64 -i $f.jpg | tr -d '\n'; echo; echo "END $f"
            done
          done
          true
      - uses: actions/upload-artifact@v4
        with:
          name: dumps
          path: /tmp/dump-*
