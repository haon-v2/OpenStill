name: Fetch skies
on:
  push:
    branches: [claude/gifted-lovelace-pbg8wv-m21]
    paths: [scripts/build-sky-library.py, .github/workflows/fetch-skies.yml]
jobs:
  sky:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mood: [blue, clouds, sunset, dramatic, overcast, night]
    steps:
      - uses: actions/checkout@v4
      - run: pip install numpy pillow >/dev/null
      - name: Build
        run: python3 scripts/build-sky-library.py --mood ${{ matrix.mood }} --out /tmp/skies
      - name: Print
        run: |
          for f in /tmp/skies/*.jpg /tmp/skies/*.json; do
            echo "BEGIN $(basename $f)"; base64 -w0 $f; echo; echo "END $(basename $f)"
          done
