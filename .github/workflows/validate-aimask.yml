name: Validate AI masks
on:
  push:
    branches: [claude/gifted-lovelace-pbg8wv-aimask]
jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build tools
        run: brew install meson ninja pkg-config cmake || true
      - name: Native dependencies
        run: bash scripts/build-native.sh > native.log 2>&1 || { tail -80 native.log; exit 1; }
      - name: Build
        run: |
          set +e
          export PKG_CONFIG_PATH="$PWD/.build/native/lib/pkgconfig"
          swift build > build.log 2>&1; status=$?
          grep -E "error:" build.log | head -60
          [ $status -eq 0 ] || grep -v "warning:\|^ *|\|^ *\^" build.log | tail -60
          grep -E "warning:" build.log | grep -E "PhotoBackdrop|EditingController|PhotoStore|ModernRenderer|PhotoLibrary|Studio|PhotoTabStrip|CropPresetPanel|MaskLayerController|Shortcuts|SettingsWindow|ViewerController|EditorPanel|AppDelegate|ShootWindow|PhotoCanvas|Filmstrip|LightroomChrome|LightroomWorkspace|WorkspaceNavigation|Appearance|EditingController" | grep -v "init(source:)" | sort -u | head -40
          exit $status
      - name: M19 tests alone
        run: |
          set +e
          export PKG_CONFIG_PATH="$PWD/.build/native/lib/pkgconfig"
          perl -e 'alarm shift; exec @ARGV' 420 bash scripts/test.sh --filter "AssistantTests|LogoPromptTests|StudioLayoutTests" --no-parallel > m8.log 2>&1
          status=$?
          grep -E "⏱|Test .*(started|passed|failed)|✘|recorded an issue|error:" m8.log | tail -40
          grep -nE "(RenderSpeedTests|StudioLayoutTests).swift:[0-9]+" m8.log | sort -u | head -30
          echo "--- started but not finished ---"
          python3 - <<'PY'
          import re
          text = open('m8.log').read()
          started = set(re.findall(r'Test (\w+\(\)) started', text)); done = set(re.findall(r'Test (\w+\(\)) (?:passed|failed)', text))
          print(sorted(started - done))
          PY
          exit $status
      - name: Tests
        run: |
          set +e
          export PKG_CONFIG_PATH="$PWD/.build/native/lib/pkgconfig"
          bash scripts/test.sh > test.log 2>&1 &
          pid=$!
          for i in $(seq 1 84); do sleep 10; kill -0 $pid 2>/dev/null || break; done
          if kill -0 $pid 2>/dev/null; then
            echo "--- still running after 14 minutes: sampling the test process ---"
            for p in $(pgrep -f "OpenStillPackageTests|swiftpm-testing"); do
              echo "== pid $p: $(ps -o command= -p $p | cut -c1-120)"
              sample $p 3 -file /tmp/sample-$p.txt > /dev/null 2>&1
              grep -nE "^ +[0-9]+ Thread_|OpenStill|Merges|HDRTone|Vision|VN[A-Z]|CIContext|CIRender|swift_once|dispatch_once|_dispatch_sync|psynch_cvwait|semaphore_wait|swift_task" /tmp/sample-$p.txt | head -250
            done
            pkill -f "OpenStillPackageTests|swiftpm-testing"; kill $pid 2>/dev/null; status=1
          else
            wait $pid; status=$?
          fi
          echo "--- last lines ---"; tail -15 test.log
          grep -E "⏱|✘|error:|recorded an issue|Test run with|time limit" test.log | head -120
          if [ $status -ne 0 ]; then echo "--- started but not finished ---"; python3 -c "import re;t=open('test.log').read();s=set(re.findall(r'Test (\\w+\\(\\)) started',t));d=set(re.findall(r'Test (\\w+\\(\\)) (?:passed|failed)',t));print(sorted(s-d))"; fi
          exit $status
      - name: Crash report
        if: failure()
        run: |
          report=$(ls -t ~/Library/Logs/DiagnosticReports/*.ips 2>/dev/null | head -1)
          [ -n "$report" ] || { echo "No crash report"; exit 0; }
          echo "== $report"
          python3 - "$report" <<'PY'
          import json, sys
          lines = open(sys.argv[1]).read().split('\n', 1)
          body = json.loads(lines[1])
          print('exception:', body.get('exception'), body.get('termination', {}).get('indicator'))
          images = body.get('usedImages', [])
          for thread in body.get('threads', []):
              if thread.get('triggered'):
                  for frame in thread.get('frames', [])[:30]:
                      image = images[frame.get('imageIndex', 0)].get('name', '?') if images else '?'
                      print(image, frame.get('symbol', '?'), frame.get('sourceFile', ''), frame.get('sourceLine', ''))
          PY
      - name: App bundle
        run: bash scripts/build-app.sh > app.log 2>&1 || { tail -60 app.log; exit 1; }
      - name: Assistant tools in the app
        run: |
          set +e
          mkdir -p /tmp/photos
          i=0; for f in /System/Library/Desktop\ Pictures/*.heic /Library/Desktop\ Pictures/*.heic; do [ -f "$f" ] || continue; i=$((i+1)); sips -s format jpeg -Z 1600 "$f" --out /tmp/photos/photo$i.jpg >/dev/null 2>&1; [ $i -ge 1 ] && break; done
          ls -la /tmp/photos
          env OPENSTILL_ASSISTANT_SELFTEST=/tmp/selftest dist/OpenStill.app/Contents/MacOS/OpenStill /tmp/photos/photo1.jpg > selftest.log 2>&1 &
          pid=$!
          for s in $(seq 1 240); do sleep 1; kill -0 $pid 2>/dev/null || break; done
          kill $pid 2>/dev/null; wait $pid
          grep -E "^STEP" selftest.log || tail -40 selftest.log
          for f in /tmp/selftest-*.jpg; do
            [ -f "$f" ] || continue
            sips -Z 900 -s format jpeg -s formatOptions 60 "$f" --out "$f.small.jpg" >/dev/null
            echo "BEGIN $f"; base64 -i "$f.small.jpg" | tr -d '\n'; echo; echo "END $f"
          done
          true
