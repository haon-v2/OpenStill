name: Diagnose speed M19
on:
  push:
    branches: [claude/gifted-lovelace-pbg8wv-m19]
jobs:
  diagnose:
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Build tools
        run: brew install meson ninja pkg-config cmake || true
      - name: Native dependencies
        run: bash scripts/build-native.sh > native.log 2>&1 || { tail -80 native.log; exit 1; }
      - name: App bundle
        run: bash scripts/build-app.sh > app.log 2>&1 || { grep -E "error:" app.log | head -40; tail -40 app.log; exit 1; }
      - name: Sample photos
        run: |
          mkdir -p /tmp/photos
          i=0; for f in /System/Library/Desktop\ Pictures/*.heic /Library/Desktop\ Pictures/*.heic; do [ -f "$f" ] || continue; i=$((i+1)); sips -s format jpeg -Z 1600 "$f" --out /tmp/photos/photo$i.jpg >/dev/null 2>&1; [ $i -ge 5 ] && break; done
          ls -la /tmp/photos
      - name: Run and screenshot
        run: |
          set +e
          while IFS='|' read name photos actions; do
            [ -n "$name" ] || continue
            defaults delete org.openstill.viewer OpenStillStudioLayout >/dev/null 2>&1
            args=""; [ "$photos" = "1" ] && args=/tmp/photos
            echo "=== $name ($actions)"
            env OPENSTILL_DUMP_ACTIONS="$actions" OPENSTILL_LAYOUT_DUMP=/tmp/dump-$name dist/OpenStill.app/Contents/MacOS/OpenStill $args &
            pid=$!
            for s in $(seq 1 60); do sleep 1; kill -0 $pid 2>/dev/null || break; done
            kill $pid 2>/dev/null; wait $pid
            for f in /tmp/dump-$name-capture.png /tmp/dump-$name-panel-capture.png; do
              [ -f $f ] || continue
              sips -Z 1300 -s format jpeg -s formatOptions 62 $f --out $f.jpg >/dev/null
              echo "BEGIN $f"; base64 -i $f.jpg | tr -d '\n'; echo; echo "END $f"
            done
          done <<'LIST'
          empty|0|
          develop|1|develop
          drag|1|develop;drag:Exposure
          dragcontrast|1|develop;drag:Contrast
          crop|1|develop;tool:crop
          masking|1|develop;tool:masking;command:maskLayer:new:radial
          zoom|1|develop;zoom
          folders|1|library;libtab:0
          filmstrip|1|develop;filmstrip
          presets|1|develop;panel:presets
          history|1|develop;panel:history
          keys|1|develop;keys:g,d,r,return,q,esc,^w,return,t,t,tab,tab,a
          LIST
          true
