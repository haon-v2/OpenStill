name: Validate M22b (temporary)
on:
  push:
    branches: [claude/gifted-lovelace-pbg8wv-m22b]
jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Build tools
        run: brew install meson ninja pkg-config cmake || true
      - name: Native dependencies
        run: bash scripts/build-native.sh > native.log 2>&1 || { tail -80 native.log; exit 1; }
      - name: New tests
        run: |
          set +e
          bash scripts/test.sh --filter "VirtualCopyTests|LibraryLocationsTests|LibraryCatalogTests" > new.log 2>&1; code=$?
          grep -E "error:|recorded an issue|Expectation failed" new.log | sort -u | head -60
          tail -30 new.log; exit $code
      - name: Full suite
        run: |
          set +e
          bash scripts/test.sh > full.log 2>&1; code=$?
          grep -E "recorded an issue|Expectation failed" full.log | head -60
          tail -15 full.log; exit $code
      - name: App bundle
        run: bash scripts/build-app.sh > app.log 2>&1 || { grep -E "error:" app.log | sort -u | head -40; tail -40 app.log; exit 1; }
      - name: Virtual copies in the real app
        run: |
          set +e
          export OPENSTILL_STORAGE_ROOT=/tmp/os-catalog; mkdir -p $OPENSTILL_STORAGE_ROOT /tmp/photos
          n=0; for f in /System/Library/Desktop\ Pictures/*.heic; do n=$((n+1)); sips -s format jpeg -Z 1600 "$f" --out /tmp/photos/IMG_000$n.jpg >/dev/null 2>&1; [ $n -ge 2 ] && break; done
          env OPENSTILL_COPY_SELFTEST=/tmp/copy dist/OpenStill.app/Contents/MacOS/OpenStill /tmp/photos > copy.log 2>&1 &
          pid=$!; for s in $(seq 1 150); do sleep 1; kill -0 $pid 2>/dev/null || break; done; kill $pid 2>/dev/null
          grep "^COPY" copy.log || tail -60 copy.log
          ls /tmp/photos
          for f in /tmp/copy-*.png; do
            [ -f "$f" ] || continue
            sips -Z 900 -s format jpeg -s formatOptions 60 "$f" --out "$f.jpg" >/dev/null
            echo "BEGIN $f"; base64 -i "$f.jpg" | tr -d '\n'; echo; echo "END $f"
          done
          grep -q "^COPY file still there true" copy.log
