name: Diagnose M21
on:
  push:
    branches: [claude/gifted-lovelace-pbg8wv-m21]
jobs:
  diagnose:
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Build tools
        run: brew install meson ninja pkg-config cmake || true
      - name: Native dependencies
        run: bash scripts/build-native.sh > native.log 2>&1 || { tail -80 native.log; exit 1; }
      - name: App bundle
        run: bash scripts/build-app.sh > app.log 2>&1 || { grep -E "error:" app.log | head -40; tail -40 app.log; exit 1; }
      - name: Sample photos
        run: |
          mkdir -p /tmp/photos
          i=0; for f in /System/Library/Desktop\ Pictures/*.heic /Library/Desktop\ Pictures/*.heic; do [ -f "$f" ] || continue; i=$((i+1)); sips -s format jpeg -Z 1600 "$f" --out /tmp/photos/photo$i.jpg >/dev/null 2>&1; [ $i -ge 5 ] && break; done
          ls -la /tmp/photos
      - name: Run and screenshot
        run: |
          set +e
          while IFS='|' read name photos actions; do
            [ -n "$name" ] || continue
            defaults delete org.openstill.viewer OpenStillStudioLayout >/dev/null 2>&1
            args=""; [ "$photos" = "1" ] && args=/tmp/photos
            echo "=== $name ($actions)"; defaults delete org.openstill.viewer OpenStill.FavoriteLooks >/dev/null 2>&1
            env OPENSTILL_DUMP_ACTIONS="$actions" OPENSTILL_LAYOUT_DUMP=/tmp/dump-$name dist/OpenStill.app/Contents/MacOS/OpenStill $args > /tmp/out-$name.log 2>&1 &
            pid=$!
            for s in $(seq 1 90); do sleep 1; kill -0 $pid 2>/dev/null || break; done
            kill $pid 2>/dev/null; wait $pid; grep -E "STEP|LOOKS|error|fatal" /tmp/out-$name.log
            for f in /tmp/dump-$name-capture.png /tmp/dump-$name-other*-capture.png; do
              [ -f $f ] || continue
              sips -Z 1300 -s format jpeg -s formatOptions 62 $f --out $f.jpg >/dev/null
              echo "BEGIN $f"; base64 -i $f.jpg | tr -d '\n'; echo; echo "END $f"
            done
          done <<'LIST'
          presets-all|1|develop;panel:presets;size:340x820
          presets-film|1|develop;panel:presets;size:340x820;looks:mode:0;looks:category:Film
          presets-applied|1|develop;panel:presets;size:340x820;looks:mode:0;looks:category:Cinematic;looks:pick:Teal & Orange
          presets-amount|1|develop;panel:presets;size:340x820;looks:mode:0;looks:category:Moody;looks:pick:Dark & Moody;looks:amount:180
          presets-mine|1|develop;panel:presets;size:340x820;looks:mode:0;looks:save:My Test Look;looks:category:My Presets
          presets-search|1|develop;panel:presets;size:340x820;looks:mode:0;looks:category:All;looks:search:b&w
          luts-all|1|develop;panel:presets;size:340x820;looks:mode:1;looks:category:All
          luts-instant|1|develop;panel:presets;size:340x820;looks:mode:1;looks:category:Film · Instant
          luts-variant|1|develop;panel:presets;size:340x820;looks:mode:1;looks:category:Film · Color;looks:pick:Portrait 400;looks:variant:+2
          luts-bw|1|develop;panel:presets;size:340x820;looks:mode:1;looks:category:Black & White
          luts-creative|1|develop;panel:presets;size:340x820;looks:mode:1;looks:category:Creative;looks:favorite:Vaporwave
          luts-scrolled|1|develop;panel:presets;size:340x820;looks:mode:1;looks:category:All;looks:scroll:3000
          luts-search|1|develop;panel:presets;size:340x820;looks:mode:1;looks:category:All;looks:search:teal
          narrow|1|develop;panel:presets;size:260x600;looks:mode:1
          nophoto|0|panel:presets;looks:mode:1
          LIST
          true
