name: Diagnose M21
on:
  push:
    branches: [claude/gifted-lovelace-pbg8wv-m21]
jobs:
  diagnose:
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Build tools
        run: brew install meson ninja pkg-config cmake || true
      - name: Native dependencies
        run: bash scripts/build-native.sh > native.log 2>&1 || { tail -80 native.log; exit 1; }
      - name: App bundle
        run: bash scripts/build-app.sh > app.log 2>&1 || { grep -E "error:" app.log | head -40; tail -40 app.log; exit 1; }
      - name: Sample photos
        run: |
          mkdir -p /tmp/photos
          i=0; for f in /System/Library/Desktop\ Pictures/*.heic /Library/Desktop\ Pictures/*.heic; do [ -f "$f" ] || continue; i=$((i+1)); sips -s format jpeg -Z 1600 "$f" --out /tmp/photos/photo$i.jpg >/dev/null 2>&1; [ $i -ge 5 ] && break; done
          ls -la /tmp/photos
      - name: Landscape photo
        run: |
          pip3 install --break-system-packages numpy pillow >/dev/null 2>&1 || pip3 install numpy pillow >/dev/null
          python3 - <<'PY'
          import importlib.util, io, math, urllib.request, numpy as np
          from PIL import Image
          spec = importlib.util.spec_from_file_location('sky', 'scripts/build-sky-library.py'); sky = importlib.util.module_from_spec(spec); spec.loader.exec_module(sky)
          url = 'https://dl.polyhaven.org/file/ph-assets/HDRIs/extra/Tonemapped%20JPG/kloofendal_48d_partly_cloudy.jpg'
          pano = np.asarray(Image.open(io.BytesIO(urllib.request.urlopen(url, timeout=120).read())).convert('RGB').resize((8192, 4096)), dtype=np.float32) / 255
          sky.WIDTH, sky.HEIGHT, sky.HFOV = 1800, 1200, 70.0
          view = np.clip(sky.project(pano, 0.0, math.radians(3)), 0, 1)
          Image.fromarray((view * 255).astype('uint8')).save('/tmp/photos/0-landscape.jpg', quality=90)
          print('landscape ready')
          PY
      - name: Run and screenshot
        run: |
          set +e
          while IFS='|' read name photos actions; do
            [ -n "$name" ] || continue
            defaults delete org.openstill.viewer OpenStillStudioLayout >/dev/null 2>&1
            args=""; [ "$photos" = "1" ] && args=/tmp/photos
            echo "=== $name ($actions)"; defaults delete org.openstill.viewer OpenStill.FavoriteLooks >/dev/null 2>&1
            env OPENSTILL_DUMP_ACTIONS="$actions" OPENSTILL_LAYOUT_DUMP=/tmp/dump-$name dist/OpenStill.app/Contents/MacOS/OpenStill $args > /tmp/out-$name.log 2>&1 &
            pid=$!
            for s in $(seq 1 90); do sleep 1; kill -0 $pid 2>/dev/null || break; done
            kill $pid 2>/dev/null; wait $pid; grep -E "STEP|LOOKS|error|fatal" /tmp/out-$name.log
            for f in /tmp/dump-$name-capture.png /tmp/dump-$name-other*-capture.png; do
              [ -f $f ] || continue
              sips -Z 1300 -s format jpeg -s formatOptions 62 $f --out $f.jpg >/dev/null
              echo "BEGIN $f"; base64 -i $f.jpg | tr -d '\n'; echo; echo "END $f"
            done
          done <<'LIST'
          skies-before|1|develop;panel:presets;size:340x820;looks:mode:2
          skies-grid|1|develop;skymask;panel:presets;size:340x820;looks:mode:2
          skies-night|1|develop;skymask;panel:presets;size:340x820;looks:mode:2;looks:category:Night;looks:pick:Moonlit · Kloppenheim 05
          skies-storm|1|develop;skymask;panel:presets;size:340x820;looks:mode:2;looks:category:Dramatic;looks:pick:Storm · Farm Field
          skies-sunset|1|develop;skymask;panel:presets;size:340x820;looks:mode:2;looks:category:Sunset & Sunrise;looks:pick:Belfast Sunset
          presets-all|1|develop;panel:presets;size:340x820
          luts-variant|1|develop;panel:presets;size:340x820;looks:mode:1;looks:category:Film · Color;looks:pick:Portrait 400;looks:variant:+2
          narrow|1|develop;panel:presets;size:260x600;looks:mode:1
          LIST
          true
