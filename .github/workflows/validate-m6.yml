name: Validate M6
on:
  push:
    branches: [claude/gifted-lovelace-pbg8wv]
jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Depth model facts
        run: |
          for f in onnx/model.onnx; do
            echo "== $f"
            curl -sSIL "https://huggingface.co/onnx-community/depth-anything-v2-small/resolve/main/$f" | grep -iE "^HTTP|x-repo-commit|x-linked-etag|x-linked-size|content-length" | tr -d '\r'
          done
      - name: AI worker checks
        run: |
          python3 -m venv /tmp/aivenv && /tmp/aivenv/bin/pip -q install numpy pillow
          /tmp/aivenv/bin/python Tests/AI/test_worker.py
      - name: Build tools
        run: brew install meson ninja pkg-config cmake || true
      - name: Native dependencies
        run: bash scripts/build-native.sh > native.log 2>&1 || { tail -80 native.log; exit 1; }
      - name: Build
        run: |
          set +e
          export PKG_CONFIG_PATH="$PWD/.build/native/lib/pkgconfig"
          swift build > build.log 2>&1; status=$?
          grep -E "error:" build.log | head -60
          [ $status -eq 0 ] || grep -v "warning:\|^ *|\|^ *\^" build.log | tail -60
          grep -E "warning:" build.log | grep -E "AIMask|LensBlur|AIMaskController|EditingController|MaskComponent|MaskEditing|LocalAI|EditorPanel|ModernRenderer|AdjustmentMasks|SelectiveControls|VersionPanel" | grep -v "init(source:)" | sort -u | head -40
          exit $status
      - name: AI mask tests alone
        run: |
          set +e
          export PKG_CONFIG_PATH="$PWD/.build/native/lib/pkgconfig"
          perl -e 'alarm shift; exec @ARGV' 420 bash scripts/test.sh --filter AIMaskTests --no-parallel > ai.log 2>&1
          status=$?
          grep -E "Test .*(started|passed|failed)|✘|recorded an issue|error:" ai.log | tail -40
          echo "--- started but not finished ---"
          python3 - <<'PY'
          import re
          text = open('ai.log').read()
          started = set(re.findall(r'Test (\w+\(\)) started', text)); done = set(re.findall(r'Test (\w+\(\)) (?:passed|failed)', text))
          print(sorted(started - done))
          PY
          exit $status
      - name: Tests
        run: |
          set +e
          export PKG_CONFIG_PATH="$PWD/.build/native/lib/pkgconfig"
          perl -e 'alarm shift; exec @ARGV' 900 bash scripts/test.sh > test.log 2>&1
          status=$?
          grep -E "✘|error:|recorded an issue|Test run with|time limit" test.log | head -120
          if [ $status -ne 0 ]; then echo "--- started but not finished ---"; python3 -c "import re;t=open('test.log').read();s=set(re.findall(r'Test (\\w+\\(\\)) started',t));d=set(re.findall(r'Test (\\w+\\(\\)) (?:passed|failed)',t));print(sorted(s-d))"; fi
          exit $status
      - name: Crash report
        if: failure()
        run: |
          report=$(ls -t ~/Library/Logs/DiagnosticReports/*.ips 2>/dev/null | head -1)
          [ -n "$report" ] || { echo "No crash report"; exit 0; }
          echo "== $report"
          python3 - "$report" <<'PY'
          import json, sys
          lines = open(sys.argv[1]).read().split('\n', 1)
          body = json.loads(lines[1])
          print('exception:', body.get('exception'), body.get('termination', {}).get('indicator'))
          images = body.get('usedImages', [])
          for thread in body.get('threads', []):
              if thread.get('triggered'):
                  for frame in thread.get('frames', [])[:30]:
                      image = images[frame.get('imageIndex', 0)].get('name', '?') if images else '?'
                      print(image, frame.get('symbol', '?'), frame.get('sourceFile', ''), frame.get('sourceLine', ''))
          PY
      - name: App bundle
        run: bash scripts/build-app.sh > app.log 2>&1 || { tail -60 app.log; exit 1; }
