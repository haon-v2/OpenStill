name: Diagnose layout
on:
  push:
    branches: [claude/gifted-lovelace-pbg8wv]
jobs:
  diagnose:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build tools
        run: brew install meson ninja pkg-config cmake || true
      - name: Native dependencies
        run: bash scripts/build-native.sh > native.log 2>&1 || { tail -80 native.log; exit 1; }
      - name: App bundle
        run: bash scripts/build-app.sh > app.log 2>&1 || { tail -60 app.log; exit 1; }
      - name: Sample photos
        run: |
          mkdir -p /tmp/photos
          i=0; for f in /System/Library/Desktop\ Pictures/*.heic /Library/Desktop\ Pictures/*.heic; do [ -f "$f" ] || continue; i=$((i+1)); sips -s format jpeg -Z 1600 "$f" --out /tmp/photos/photo$i.jpg >/dev/null 2>&1; [ $i -ge 5 ] && break; done
          if [ $i -eq 0 ]; then for n in 1 2 3; do python3 -c "
          import zlib,struct
          w,h=800,600
          raw=b''.join(b'\x00'+bytes([(x*255//w),(y*255//h),120]*1 for x in range(w)) if False else b'' for y in range(h))
          " ; done; fi
          ls -la /tmp/photos
      - name: Run and screenshot
        run: |
          set +e
          for variant in lightroom library; do
            defaults write org.openstill.viewer OpenStillWorkspaceLayout lightroom
            OPENSTILL_DUMP_MODULE=$variant OPENSTILL_LAYOUT_DUMP=/tmp/dump-$variant dist/OpenStill.app/Contents/MacOS/OpenStill /tmp/photos &
            pid=$!
            sleep 7
            wait $pid
            for f in /tmp/dump-$variant.png; do
              [ -f $f ] || { echo "missing $f"; continue; }
              sips -Z 900 -s format jpeg -s formatOptions 60 $f --out $f.jpg >/dev/null
              echo "BEGIN $f"; base64 -i $f.jpg | tr -d '\n'; echo; echo "END $f"
            done
          done
          true
      - uses: actions/upload-artifact@v4
        with:
          name: dumps
          path: /tmp/dump-*
