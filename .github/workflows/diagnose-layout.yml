name: Diagnose layout
on:
  push:
    branches: [claude/gifted-lovelace-pbg8wv]
jobs:
  diagnose:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build tools
        run: brew install meson ninja pkg-config cmake || true
      - name: Native dependencies
        run: bash scripts/build-native.sh > native.log 2>&1 || { tail -80 native.log; exit 1; }
      - name: App bundle
        run: bash scripts/build-app.sh > app.log 2>&1 || { tail -60 app.log; exit 1; }
      - name: Sample photos
        run: |
          mkdir -p /tmp/photos
          i=0; for f in /System/Library/Desktop\ Pictures/*.heic /Library/Desktop\ Pictures/*.heic; do [ -f "$f" ] || continue; i=$((i+1)); sips -s format jpeg -Z 1600 "$f" --out /tmp/photos/photo$i.jpg >/dev/null 2>&1; [ $i -ge 5 ] && break; done
          if [ $i -eq 0 ]; then for n in 1 2 3; do python3 -c "
          import zlib,struct
          w,h=800,600
          raw=b''.join(b'\x00'+bytes([(x*255//w),(y*255//h),120]*1 for x in range(w)) if False else b'' for y in range(h))
          " ; done; fi
          ls -la /tmp/photos
      - name: Run and dump
        run: |
          set +e
          for layout in lightroom luminar; do
            OPENSTILL_LAYOUT=$layout OPENSTILL_LAYOUT_DUMP=/tmp/dump-$layout perl -e 'alarm shift; exec @ARGV' 60 dist/OpenStill.app/Contents/MacOS/OpenStill /tmp/photos
            echo "== $layout exit $?"
            cat /tmp/dump-$layout.txt | head -400
            screencapture -x /tmp/screen-$layout.png 2>/dev/null
          done
          true
      - uses: actions/upload-artifact@v4
        with:
          name: dumps
          path: /tmp/dump-*
