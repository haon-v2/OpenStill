name: Validate M4
on:
  push:
    branches: [claude/gifted-lovelace-pbg8wv]
jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Native dependencies
        run: bash scripts/build-native.sh > native.log 2>&1 || { tail -80 native.log; exit 1; }
      - name: Build
        run: |
          export PKG_CONFIG_PATH="$PWD/.build/native/lib/pkgconfig"
          swift build 2>&1 | tee build.log | grep -E "error:|warning:" | grep -v "^.*\.build/checkouts" | head -80
          test ${PIPESTATUS[0]} -eq 0
      - name: Tests
        run: |
          set +e
          export PKG_CONFIG_PATH="$PWD/.build/native/lib/pkgconfig"
          bash scripts/test.sh > test.log 2>&1
          status=$?
          grep -E "✘|error:|recorded an issue|Test run with|XMPImport" test.log | head -120
          exit $status
      - name: App bundle
        run: bash scripts/build-app.sh > app.log 2>&1 || { tail -60 app.log; exit 1; }
