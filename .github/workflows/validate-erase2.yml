name: Validate erase pipeline
on:
  push:
    branches: [claude/gifted-lovelace-pbg8wv-erase2]
jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build tools
        run: brew install meson ninja pkg-config cmake || true
      - name: Native dependencies
        run: bash scripts/build-native.sh > native.log 2>&1 || { tail -80 native.log; exit 1; }
      - name: App bundle
        run: bash scripts/build-app.sh > app.log 2>&1 || { grep -E "error:" app.log | head -40; tail -40 app.log; exit 1; }
      - name: Build and AI tests
        run: |
          set +e
          export PKG_CONFIG_PATH="$PWD/.build/native/lib/pkgconfig"
          perl -e 'alarm shift; exec @ARGV' 600 bash scripts/test.sh --filter "AIBaseTests|SkyReplacementTests|AssistantEditTests" --no-parallel > t.log 2>&1; status=$?
          grep -A3 -E "recorded an issue" t.log | cut -c1-1500 | head -40; grep -E "error:|Test run with" t.log | head -20
          exit $status
      - name: Sample photos
        run: |
          set +e
          mkdir -p /tmp/photos
          for f in /System/Library/Desktop\ Pictures/*.heic; do sips -s format jpeg -Z 2400 "$f" --out /tmp/photos/a-photo.jpg >/dev/null 2>&1; break; done
          # A real RAW file from the rawpy project's test images.
          curl -sSL https://api.github.com/repos/letmaik/rawpy/contents/test | python3 -c "
          import json,sys
          items=json.load(sys.stdin)
          raws=[i for i in items if i['name'].lower().rsplit('.',1)[-1] in ('nef','cr2','dng','arw','orf','raf','rw2')]
          raws.sort(key=lambda i:(not i['name'].upper().endswith('.NEF'), i['size']))
          print('\n'.join(i['download_url']+' '+i['name']+' '+str(i['size']) for i in raws))" > raws.txt
          cat raws.txt
          url=$(head -1 raws.txt | cut -d' ' -f1); name=$(head -1 raws.txt | cut -d' ' -f2)
          [ -n "$url" ] && curl -sSL "$url" -o "/tmp/photos/b-$name"
          ls -la /tmp/photos
      - name: Erase through the real pipeline
        run: |
          set +e
          env OPENSTILL_AI_STUB=1 OPENSTILL_ERASE_SELFTEST=/tmp/erase dist/OpenStill.app/Contents/MacOS/OpenStill /tmp/photos/* > erase.log 2>&1 &
          pid=$!
          for s in $(seq 1 600); do sleep 1; kill -0 $pid 2>/dev/null || break; done
          kill $pid 2>/dev/null; wait $pid
          grep -E "^(URLS|PHOTO|BEFORE|AFTER|RENDER|DONE)" erase.log; echo "--- log tail"; tail -30 erase.log
          for f in /tmp/erase-*.jpg; do
            [ -f "$f" ] || continue
            sips -Z 700 -s format jpeg -s formatOptions 60 "$f" --out "$f.small.jpg" >/dev/null
            echo "BEGIN $f"; base64 -i "$f.small.jpg" | tr -d '\n'; echo; echo "END $f"
          done
          true
