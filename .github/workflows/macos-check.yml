# Temporary: builds the app and runs the test suite on macOS for this branch.
name: macOS build check

on:
  push:
    branches: [claude/gifted-lovelace-pbg8wv]

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build tools
        run: brew install meson ninja pkg-config cmake || true
      - name: Native dependencies
        run: |
          bash scripts/build-native.sh > native.log 2>&1 || { tail -80 native.log; exit 1; }
      - name: Build app bundle
        run: |
          set +e
          bash scripts/build-app.sh > build.log 2>&1
          status=$?
          grep -E "error:|Built " build.log | head -40
          grep -E "warning:" build.log | grep -E "SettingsWindow|UpdateController|AppDelegate" | head -20
          exit $status
      - name: Launch
        run: |
          dist/OpenStill.app/Contents/MacOS/OpenStill > launch.log 2>&1 & pid=$!
          sleep 15
          if kill -0 $pid; then echo "running"; kill $pid; else cat launch.log; exit 1; fi
      - name: Tests
        run: |
          set +e
          bash scripts/test.sh > test.log 2>&1
          status=$?
          grep -E "✘|error:|recorded an issue|Test run with" test.log | head -80
          exit $status
