# Temporary: builds the app and runs the test suite on macOS for this branch.
name: macOS build check

on:
  push:
    branches: [claude/gifted-lovelace-pbg8wv]

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Build tools
        run: brew install meson ninja pkg-config cmake || true
      - name: Native dependencies
        run: |
          bash scripts/build-native.sh > native.log 2>&1 || { tail -80 native.log; exit 1; }
      - name: Build app
        run: |
          set +e
          PKG_CONFIG_PATH="$PWD/.build/native/lib/pkgconfig" swift build > build.log 2>&1
          status=$?
          grep -E "error:|Build complete" build.log
          grep -E "warning:" build.log | grep -E "CropPreset|UpdateC|PhotoCanvas|EditorPanel|EditingController|AppDelegate"
          exit $status
      - name: Tests
        run: |
          set +e
          bash scripts/test.sh > test.log 2>&1
          status=$?
          grep -E "✘|error:|failed|passed after|Test run with" test.log | tail -120
          exit $status
