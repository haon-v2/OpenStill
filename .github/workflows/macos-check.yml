# Temporary: builds the app and runs the test suite on macOS for this branch.
name: macOS build check

on:
  push:
    branches: [claude/gifted-lovelace-pbg8wv]

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: sw_vers; xcodebuild -version; swift --version
      - name: Build tools
        run: brew install meson ninja pkg-config cmake || true
      - name: Native dependencies
        run: bash scripts/build-native.sh > native.log 2>&1 || (tail -80 native.log; exit 1)
      - name: Build app
        run: PKG_CONFIG_PATH="$PWD/.build/native/lib/pkgconfig" swift build 2>&1 | grep -E 'error|warning: .*(CropPreset|UpdateC|PhotoCanvas|EditorPanel|EditingController|AppDelegate)|Compiling|Build complete' | grep -v '^\[.*Compiling' ; exit ${PIPESTATUS[0]}
      - name: Tests
        run: bash scripts/test.sh 2>&1 | tail -150; exit ${PIPESTATUS[0]}
